name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: 10.5.0
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - run: pnpm install
            - run: pnpm check
            - run: npm ci
              working-directory: examples/order-approval
            - run: npm test
              working-directory: examples/order-approval
